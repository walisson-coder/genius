<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gênius</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA 1: INÍCIO -->
    <section id="tela-inicio" class="tela">
        <h1>Gênius</h1>
        <p>Olhe a sequência de cores e repita na mesma ordem.</p>
        <p>Você tem 2 minutos.</p>
        <button id="btn-iniciar" class="btn">Começar</button>
    </section>

    <!-- TELA 2: JOGO -->
    <section id="tela-jogo" class="tela escondida">
        <div class="barra">
            <span>Sequência: <b id="pontos">0</b></span>
            <span>Tempo: <b id="tempo">2:00</b></span>
        </div>

        <div class="grade">
            <button class="pad verde"></button>
            <button class="pad vermelho"></button>
            <button class="pad amarelo"></button>
            <button class="pad azul"></button>
        </div>

        <p id="status">Preste atenção...</p>
    </section>

    <!-- TELA 3: FIM DE JOGO E APELIDO -->
    <section id="tela-fim" class="tela escondida">
        <h2 id="motivo">Fim de jogo!</h2>
        <p>Sua maior sequência</p>
        <p id="resultado">0</p>

        <label for="apelido">Digite um apelido</label>
        <input id="apelido" type="text" maxlength="12" placeholder="Ex.: DevRaiz">
        <p class="aviso">Use um apelido, não o seu nome.</p>

        <button id="btn-salvar" class="btn">Ver o ranking</button>
        <button id="btn-pular" class="btn-simples">Pular</button>
    </section>

    <!-- TELA 4: RANKING -->
    <section id="tela-ranking" class="tela escondida">
        <h2>Ranking</h2>
        <p id="aviso-ranking" class="aviso"></p>
        <ol id="lista"></ol>

        <button class="btn btn-novo">Voltar ao início</button>
    </section>

    <!-- CARREGANDO -->
    <div id="carregando" class="carregando escondida">
        <div class="girador"></div>
        <p>Carregando o ranking...</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
